# Portable fallback for VMs and GPUs/drivers without a usable GLX compositor.
backend = "xrender";
vsync = true;
use-damage = true;

corner-radius = 10;
detect-rounded-corners = true;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.26;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-color = "#000000";
crop-shadow-to-monitor = true;

fading = true;
fade-delta = 10;
fade-in-step = 0.10;
fade-out-step = 0.10;

frame-opacity = 1.0;
unredir-if-possible = false;
detect-client-opacity = true;
detect-transient = true;
use-ewmh-active-win = true;
log-level = "warn";

rules = (
    {
        match = "fullscreen";
        corner-radius = 0;
        shadow = false;
        fade = false;
        blur-background = false;
    },
    {
        match = "_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_VERT' || "
                "_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_HORZ'";
        corner-radius = 0;
        shadow = false;
        blur-background = false;
    },
    {
        match = "window_type = 'dock' || "
                "window_type = 'desktop' || "
                "window_type = 'menu' || "
                "window_type = 'dropdown_menu' || "
                "window_type = 'popup_menu' || "
                "window_type = 'tooltip' || "
                "window_type = 'notification'";
        corner-radius = 0;
        shadow = false;
        fade = false;
        blur-background = false;
    }
);
